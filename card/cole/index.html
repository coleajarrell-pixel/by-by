 <style>
  :root{--bg:#f3ecdd;--surface:#fbf7ee;--border:#dccfb0;--text:#332a1c;--muted:#7c7160;--accent:#a8532a;--accent-h:#8a431f;--soft:#e4a264}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;min-height:100dvh;font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
   background:radial-gradient(120% 60% at 15% 0%,rgba(228,162,100,.22),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(168,83,42,.12),transparent 60%),linear-gradient(180deg,#f6efe2,#efe2ce);
   display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px)}
  .card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:34px 24px 26px;box-shadow:0 24px 60px -28px rgba(51,42,28,.35),0 2px 0 rgba(255,255,255,.7) inset;text-align:center;align-self:flex-start;animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .logo{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.35rem;line-height:1.05;display:inline-flex;flex-direction:column;color:var(--text);text-decoration:none}
  .logo em{font-style:normal;color:var(--accent)}
  .logo span{font-family:"Inter",sans-serif;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:5px}
  .avatar{width:96px;height:96px;border-radius:50%;margin:28px auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--accent),#4f6a85);color:#fbf7ee;font-family:"Fraunces",Georgia,serif;font-size:2rem;font-weight:600;box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--border)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:2.3rem;letter-spacing:-.01em;margin:0 0 6px;line-height:1.05}
  .loc{color:var(--muted);font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;margin:0 0 26px}
  .save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 20px;border-radius:16px;background:var(--accent);color:#fbf7ee;font-weight:600;font-size:1.06rem;text-decoration:none;box-shadow:0 10px 24px -12px rgba(168,83,42,.8);transition:background .2s,transform .1s}
  .save:active{transform:scale(.98);background:var(--accent-h)}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 24px}
  .actions a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border:1px solid var(--border);border-radius:14px;background:#fff8;color:var(--text);text-decoration:none;font-size:.76rem;font-weight:500;transition:transform .1s,border-color .2s}
  .actions a:active{transform:scale(.96);border-color:var(--accent)}
  .actions svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .details{list-style:none;margin:0;padding:0;text-align:left;border-top:1px solid var(--border)}
  .details li{border-bottom:1px solid var(--border)}
  .details a,.details div{display:flex;align-items:center;gap:14px;padding:15px 4px;color:var(--text);text-decoration:none;font-size:.95rem}
  .details small{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .details svg{flex:none;width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .details span{min-width:0;overflow-wrap:anywhere}
  .share{margin-top:22px;background:none;border:1px dashed var(--border);border-radius:12px;padding:12px 16px;width:100%;font:500 .85rem "Inter",sans-serif;color:var(--muted);cursor:pointer}
  .qr{display:none;margin:16px auto 0;width:220px;border-radius:12px}
  .qr.on{display:block}
  .foot{margin-top:22px;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
 </style>
</head>
<body>

   <a href="mailto:coleajarrell@gmail.com"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>Email</a>

   <li><a href="https://coleajarrell-pixel.github.io/by-by/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span><small>Website</small>coleajarrell-pixel.github.io/by-by</span></a></li>
   <li><div><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><span><small>Based in</small>Charleston, SC</span></div></li>
  </ul>

  <button class="share" type="button" id="share">Share this card</button>
  <img class="qr" id="qr" src="cole-qr-branded.png" alt="QR code for Cole Jarrell's contact card" width="220" height="220">
  <p class="foot">By &amp; By Productions &middot; Charleston, SC</p>
 </main>
 <script>
  document.getElementById('share').addEventListener('click', function () {
   var data = { title: 'Cole Jarrell | By & By Productions', url: location.href };
   if (navigator.share) { navigator.share(data).catch(function(){}); }
   else { document.getElementById('qr').classList.toggle('on'); }
  });
 </script>
</body>
</html>
